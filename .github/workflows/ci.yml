name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -c "import xml.etree.ElementTree as E; E.parse('backupconfig.example.xml')"
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.6
      - run: ruff check .
      - run: ruff format --check .
  secrets:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks binary scans the whole history (the gitleaks-action fails on a repo's first push).
      - name: gitleaks (full history)
        run: |
          V=8.24.3
          U=https://github.com/gitleaks/gitleaks/releases/download/v$V
          curl -sSfL -o gitleaks.tgz "$U/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL "$U/gitleaks_${V}_checksums.txt" | grep " gitleaks_${V}_linux_x64.tar.gz$" | sed 's/ .*/  gitleaks.tgz/' | sha256sum -c -
          tar -xzf gitleaks.tgz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact -v .
